name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest tests/ -v

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The User Guide PDF and the screenshots are NOT built in CI: neither
      # pandoc/TeX Live nor Nuke ship on the GitHub-hosted runner, and installing
      # the TeX Live toolchain on every release is slow and heavy. They are built
      # locally and committed instead (`make docs`). CI bundles the committed
      # docs/user-guide.pdf into the release zip; the screenshots are NOT shipped
      # (they are embedded in the PDF and rendered on the GitHub README), so they
      # would only bloat the zip.
      - name: Build release zip
        run: |
          mkdir -p staging/Labelmaker/docs
          cp __init__.py labelmaker.py labelmaker_config.py labelmaker_prefs.py \
             labelmaker_deoverlap.py labelmaker_prefs_dialog.py \
             labelmaker_config_editor.py menu.py base_config.json README.md \
             staging/Labelmaker/
          # Bundle the committed User Guide PDF (screenshots are intentionally
          # excluded — see the note above).
          cp docs/user-guide.pdf staging/Labelmaker/docs/
          touch "staging/Labelmaker/${{ github.ref_name }}"
          cd staging
          zip -r "../Labelmaker-${{ github.ref_name }}.zip" Labelmaker/
      - uses: softprops/action-gh-release@v2
        with:
          files: "Labelmaker-${{ github.ref_name }}.zip"
          generate_release_notes: true
